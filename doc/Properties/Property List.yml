docs: |-
  # Property List

  Returns a paginated list of published properties (newest `id` first).
  Optional filters are combined with AND.

  Find Us map: call this endpoint with `property_type_id`, `location_id`, and/or
  `status`, then plot markers from each item's `location.latitude` /
  `location.longitude`. Load dropdown options from `/api/property-types` and
  `/api/locations` (status values are a fixed enum below).

  Example: `/api/properties?property_type_id=1&status=ongoing&location_id=2&limit=6`

  ## Query parameters

  | Field | Type | Required | Notes |
  |-------|------|----------|-------|
  | `page` | integer | no | Page number (default 1) |
  | `limit` | integer | no | Page size (default 15, min 1, max 100) |
  | `property_type_id` | integer | no | Filter by property type id |
  | `location_id` | integer | no | Filter by location id |
  | `status` | string | no | `upcoming`, `ongoing`, `completed`, or `sold_out` (`draft` not allowed) |

  Status dropdown options (fixed enum, no lookup endpoint):

  | Value | Label idea |
  |-------|------------|
  | `upcoming` | Upcoming |
  | `ongoing` | Ongoing |
  | `completed` | Completed |
  | `sold_out` | Sold out |

  ## Response example — `200 OK`

