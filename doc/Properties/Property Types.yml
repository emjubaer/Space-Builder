info:
  name: Property Types
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/property-types"
  headers:
    - name: Accept
      value: application/json
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Property Types

  Returns active property types for the Explore "Project Type" dropdown
  (ordered by name).

  ## Response example — `200 OK`

  ```json
  {
    "success": true,
    "status": 200,
    "message": "Property types retrieved.",
    "data": [
      {
        "id": 1,
        "name": "Commercial",
        "slug": "commercial"
      },
      {
        "id": 2,
        "name": "Residential",
        "slug": "residential"
      }
    ]
  }
  ```
