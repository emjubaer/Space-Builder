info:
  name: Featured Properties
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/properties/featured"
  params:
    - name: limit
      value: "6"
      type: query
      disabled: true
  headers:
    - name: Accept
      value: application/json
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Featured Properties

  Returns published properties marked as featured (newest `id` first).

  ## Query parameters

  | Field | Type | Required | Notes |
  |-------|------|----------|-------|
  | `limit` | integer | no | Result count (default 6, min 1, max 20) |

  ## Response example — `200 OK`

  ```json
  {
    "success": true,
    "status": 200,
    "message": "Featured properties retrieved.",
    "data": [
      {
        "id": 1,
