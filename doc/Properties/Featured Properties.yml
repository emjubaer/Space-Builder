        "land_area_unit": "katha",
        "total_floors": 12,
        "apartments_per_floor": 2,
        "apartment_size": "1450.00",
        "bedrooms": 3,
        "bathrooms": 3,
        "launch_date": "2025-01-15",
        "expected_completion_date": "2027-06-30",
        "is_featured": true,
        "location": {
          "id": 1,
          "name": "Gulshan",
          "address": "Road 12, Gulshan-2",
