info:
  name: Locations
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/locations"
  headers:
    - name: Accept
      value: application/json
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Locations

  Returns all locations for the Explore "Location" dropdown (ordered by name).

  ## Response example — `200 OK`

  ```json
  {
    "success": true,
    "status": 200,
    "message": "Locations retrieved.",
    "data": [
      {
        "id": 1,
        "name": "Gulshan",
        "city": "Dhaka",
        "area": "Gulshan-2"
      },
      {
        "id": 2,
        "name": "Dhanmondi",
        "city": "Dhaka",
        "area": "Road 27"
      }
    ]
  }
  ```
