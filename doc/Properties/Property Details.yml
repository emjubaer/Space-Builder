info:
  name: Property Details
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/properties/:slug"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: slug
      value: inforisen-office
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Property Details

  Returns a single published property by slug, including description, features,
  location details, and image groups (cover, gallery, floor plans, tour).

  ## Path parameters

  | Field | Type | Required |
  |-------|------|----------|
  | `slug` | string | yes |

  ## Response example — `200 OK`

  ```json
  {
    "success": true,
    "status": 200,
    "message": "Property retrieved.",
    "data": {
      "id": 1,
      "title": "Green Valley Residences",
      "slug": "green-valley-residences",
      "short_description": "Premium apartments in Gulshan",
      "description": "Full project description...",
      "status": "ongoing",
      "land_area": "10.00",
      "land_area_unit": "katha",
      "total_floors": 12,
      "apartments_per_floor": 2,
      "apartment_size": "1450.00",
      "bedrooms": 3,
      "bathrooms": 3,
      "launch_date": "2025-01-15",
      "expected_completion_date": "2027-06-30",
      "is_featured": true,
      "location": {
        "id": 1,
        "name": "Gulshan",
        "address": "Road 12, Gulshan-2",
        "city": "Dhaka",
        "area": "Gulshan-2",
        "latitude": "23.780887",
        "longitude": "90.416664",
        "map_url": "https://maps.google.com/?q=23.78,90.41",
        "image_url": null
      },
      "property_type": {
        "id": 1,
        "name": "Residential",
        "slug": "residential"
      },
      "features": [
        {
          "id": 1,
          "name": "24/7 Security",
          "slug": "24-7-security",
          "icon": "shield"
        }
      ],
      "cover_image": {
        "id": 10,
        "url": "http://localhost/storage/property-cover/cover.jpg",
        "alt_text": "Project cover",
        "caption": null,
        "image_type": "cover"
      },
      "gallery_images": [],
      "floor_plan_images": [],
      "tour_images": []
    }
  }
  ```
