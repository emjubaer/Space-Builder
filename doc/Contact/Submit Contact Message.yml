info:
  name: Submit Contact Message
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/api/contact-messages'
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "first_name": "Jane",
        "last_name": "Doe",
        "email": "jane@example.com",
        "phone": "+8801700000000",
        "subject": "Project inquiry",
        "message": "I would like to know more about your upcoming projects."
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Submit Contact Message

  Creates a new contact inquiry with status `new`.

  ## Request body

  | Field | Type | Required |
  |-------|------|----------|
  | `first_name` | string | yes |
  | `last_name` | string | no |
  | `email` | string | yes |
  | `phone` | string | no |
  | `subject` | string | yes |
  | `message` | string | yes |

  ## Response example — `201 Created`

  ```json
  {
    "success": true,
    "status": 201,
    "message": "Your message has been sent successfully.",
    "data": {
      "id": 1,
      "first_name": "Jane",
      "last_name": "Doe",
      "email": "jane@example.com",
      "phone": "+8801700000000",
      "subject": "Project inquiry",
      "status": "new",
      "created_at": "2026-11-11T12:00:00.000000Z"
    }
  }
  ```

  ## Response example — `422 Unprocessable Entity`

  ```json
  {
    "message": "The subject field is required. (and 1 more error)",
    "errors": {
      "subject": ["The subject field is required."],
      "message": ["The message field is required."]
    }
  }
  ```
