info:
  name: Blog List
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/blogs"
  params:
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: limit
      value: "15"
      type: query
      disabled: true
  headers:
    - name: Accept
      value: application/json
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Blog List

  Returns a paginated list of published blogs (newest `published_at` first).

  ## Query parameters

  | Field | Type | Required | Notes |
  |-------|------|----------|-------|
  | `page` | integer | no | Page number (default 1) |
  | `limit` | integer | no | Page size (default 15, min 1, max 100) |
  | `search` | string | no | Filter by title, slug, excerpt, or description |

  ## Response example — `200 OK`

  ```json
  {
    "success": true,
    "status": 200,
    "message": "Blogs retrieved.",
    "data": [
      {
        "id": 1,
        "title": "Modern Home Design",
        "slug": "modern-home-design",
        "excerpt": null,
        "description": "Tips for modern homes",
        "featured_image_url": "http://localhost/storage/blog-featured/featured.jpg",
        "cover_images": [
          {
            "id": 10,
            "url": "http://localhost/storage/blog-covers/cover-a.jpg",
            "alt_text": "Hero cover",
            "caption": null
          }
        ],
        "reading_time": 3,
        "published_at": "2026-11-11T12:00:00.000000Z",
        "category": {
          "id": 1,
          "name": "Design",
          "slug": "design"
        },
        "author": {
          "id": 1,
          "name": "Jane Doe",
          "slug": "jane-doe",
          "avatar_url": null
        }
      }
    ],
    "meta": {
      "current_page": 1,
      "per_page": 15,
      "total": 1,
      "last_page": 1,
      "from": 1,
      "to": 1
    }
  }
  ```
