info:
  name: Blog Search
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/blogs?search=home&limit=1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: search
      value: home
      type: query
    - name: limit
      value: "1"
      type: query
    - name: page
      value: "1"
      type: query
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Blog Search

  Same endpoint as Blog List with a `search` query. Matches `title`, `slug`,
  `excerpt`, and `description` (case-insensitive LIKE).

  ## Query parameters

  | Field | Type | Required | Notes |
  |-------|------|----------|-------|
  | `search` | string | yes (for search) | Search term, e.g. `home` |
  | `limit` | integer | no | Page size (default 15, min 1, max 100) |
  | `page` | integer | no | Page number |

  ## Response example — `200 OK`

  ```json
  {
    "data": [
      {
        "id": 1,
        "title": "Modern Home Design",
        "slug": "modern-home-design",
        "excerpt": null,
        "description": "Tips for modern homes",
        "featured_image_url": "http://localhost/storage/blog-featured/featured.jpg",
        "cover_images": [
          {
            "id": 10,
            "url": "http://localhost/storage/blog-covers/cover-a.jpg",
            "alt_text": "Hero cover",
            "caption": null
          }
        ],
        "reading_time": 3,
        "published_at": "2026-11-11T12:00:00.000000Z",
        "category": {
          "id": 1,
          "name": "Design",
          "slug": "design"
        },
        "author": {
          "id": 1,
          "name": "Jane Doe",
          "slug": "jane-doe",
          "avatar_url": null
        }
      }
    ],
    "links": {
      "first": "http://localhost/api/blogs?search=home&page=1",
      "last": "http://localhost/api/blogs?search=home&page=1",
      "prev": null,
      "next": null
    },
    "meta": {
      "current_page": 1,
      "from": 1,
      "last_page": 1,
      "per_page": 5,
      "to": 1,
      "total": 1
    }
  }
  ```
