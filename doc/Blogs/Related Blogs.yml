info:
  name: Related Blogs
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/blogs/:slug/related"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: slug
      value: aaaaaaaaaa
      type: path
    - name: limit
      value: "4"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Related Blogs

  Returns other published blogs in the same category as the given slug
  (excludes the current blog). Newest first.

  ## Path parameters

  | Field | Type | Required |
  |-------|------|----------|
  | `slug` | string | yes |

  ## Query parameters

  | Field | Type | Required | Notes |
  |-------|------|----------|-------|
  | `limit` | integer | no | Result count (default 4, min 1, max 20) |

  ## Response example — `200 OK`

  ```json
  {
    "success": true,
    "status": 200,
    "message": "Related blogs retrieved.",
    "data": [
      {
        "id": 2,
        "title": "Open Plan Living",
        "slug": "open-plan-living",
        "excerpt": null,
        "description": "Ideas for open spaces",
        "featured_image_url": "http://localhost/storage/blog-featured/related.jpg",
        "cover_images": [
          {
            "id": 20,
            "url": "http://localhost/storage/blog-covers/related-cover.jpg",
            "alt_text": null,
            "caption": null
          }
        ],
        "reading_time": 2,
        "published_at": "2026-11-10T12:00:00.000000Z",
        "category": {
          "id": 1,
          "name": "Design",
          "slug": "design"
        },
        "author": {
          "id": 1,
          "name": "Jane Doe",
          "slug": "jane-doe",
          "avatar_url": null
        }
      }
    ]
  }
  ```

  ## Response example — `404 Not Found`

  ```json
  {
    "message": "No query results for model [App\\Models\\Blog]."
  }
  ```
