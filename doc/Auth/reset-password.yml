info:
  name: Reset Password
  type: http
  seq: 4

http:
  method: POST
  url: '{{baseUrl}}/api/reset-password'
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "paste-reset-token-from-email",
        "email": "{{email}}",
        "password": "new-password"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Reset Password

  Set a new password using the token from the reset email.
  No `password_confirmation` field is required.
  On success, all existing Sanctum tokens for the user are revoked.

  ## Request body

  | Field | Type | Required | Notes |
  |-------|------|----------|-------|
  | `token` | string | yes | From the reset email notification |
  | `email` | string | yes | Account email |
  | `password` | string | yes | New password (no confirmation) |

  ## Response example — `200 OK`

  ```json
  {
    "message": "Your password has been reset."
  }
  ```

  ## Response example — `422 Unprocessable Entity` (invalid token)

  ```json
  {
    "message": "This password reset token is invalid.",
    "errors": {
      "email": ["This password reset token is invalid."]
    }
  }
  ```
