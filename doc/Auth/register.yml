info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/api/register'
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "mobile": "{{mobile}}",
        "password": "{{password}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body.token) {
          bru.setEnvVar('token', res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Register

  Create a new user and return a Sanctum API token.

  ## Request body

  | Field | Type | Required | Notes |
  |-------|------|----------|-------|
  | `email` | string | yes | Unique email |
  | `mobile` | string | yes | Unique mobile, max 20 chars |
  | `password` | string | yes | No confirmation field |

  ## Response example — `201 Created`

  ```json
  {
    "message": "Registered successfully.",
    "token": "1|abcdefghijklmnopqrstuvwxyz",
    "user": {
      "id": 1,
      "name": null,
      "email": "api@example.com",
      "mobile": "01700000000",
      "email_verified_at": null,
      "created_at": "2026-11-11T03:00:00.000000Z",
      "updated_at": "2026-11-11T03:00:00.000000Z"
    }
  }
  ```

  ## Response example — `422 Unprocessable Entity`

  ```json
  {
    "message": "The email has already been taken. (and 1 more error)",
    "errors": {
      "email": ["The email has already been taken."],
      "mobile": ["The mobile has already been taken."]
    }
  }
  ```
