info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/api/register'
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "{{name}}",
        "email": "{{email}}",
        "mobile": "{{mobile}}",
        "password": "{{password}}",
        "referral_code": null
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body.data?.token) {
          bru.setEnvVar('token', res.body.data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Register

  Create a new user, auto-generate a referral code/link, and return a Sanctum API token.

  ## Request body

  | Field | Type | Required | Notes |
  |-------|------|----------|-------|
  | `name` | string | yes | Max 255 chars |
  | `email` | string | yes | Unique email |
  | `mobile` | string | yes | Unique mobile, max 20 chars |
  | `password` | string | yes | No confirmation field |
  | `referral_code` | string | no | Inviter's code from `/ref/{code}`; sets `referred_by` when valid |

  ## Response example — `201 Created`

  ```json
  {
    "success": true,
    "status": 201,
    "message": "Registered successfully.",
    "data": {
      "token": "1|abcdefghijklmnopqrstuvwxyz",
      "user": {
        "id": 1,
        "name": "Rifat Ahamed",
        "email": "api@example.com",
        "mobile": "01700000000",
        "referral_code": "ngm84gf1",
        "referral_link": "{{baseUrl}}/ref/ngm84gf1",
        "email_verified_at": null,
        "created_at": "2026-11-11T03:00:00.000000Z",
        "updated_at": "2026-11-11T03:00:00.000000Z"
      }
    }
  }
  ```

  `referral_link` is always `{APP_URL}/ref/{referral_code}`.

  ## Response example — `422 Unprocessable Entity`

  ```json
  {
    "message": "The email has already been taken. (and 1 more error)",
    "errors": {
      "email": ["The email has already been taken."],
      "mobile": ["The mobile has already been taken."]
    }
  }
  ```
