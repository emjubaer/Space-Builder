info:
  name: Forgot Password
  type: http
  seq: 3

http:
  method: POST
  url: '{{baseUrl}}/api/forgot-password'
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Forgot Password

  Request a password reset email. Always returns a generic success message
  (whether or not the account exists) to avoid email enumeration.

  ## Request body

  | Field | Type | Required |
  |-------|------|----------|
  | `email` | string | yes |

  ## Response example — `200 OK`

  ```json
  {
    "success": true,
    "status": 200,
    "message": "A reset link will be sent if the account exists.",
    "data": []
  }
  ```

  ## Response example — `422 Unprocessable Entity`

  ```json
  {
    "message": "The email field is required.",
    "errors": {
      "email": ["The email field is required."]
    }
  }
  ```
