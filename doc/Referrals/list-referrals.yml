info:
  name: List Referrals
  type: http
  seq: 3

http:
  method: GET
  url: '{{baseUrl}}/api/referrals'
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List Referrals

  Returns the authenticated user's id/name and their full referred list.

  ## Response example — `200 OK`

  ```json
  {
    "success": true,
    "status": 200,
    "message": "Referrals retrieved successfully.",
    "data": {
      "user": {
        "id": 1,
        "name": "Rifat Ahamed"
      },
      "referrals": [
        {
          "id": 1,
          "referred_name": "Rifat Ahamed",
          "referred_phone": "+8801400715037",
          "submitted_at": "2026-11-12T00:00:00.000000Z",
          "status": "unverified",
          "source": "manual",
          "note": "Lorem Ipsum"
        }
      ]
    }
  }
  ```

  ## Response example — `401 Unauthorized`

  ```json
  {
    "message": "Unauthenticated."
  }
  ```
